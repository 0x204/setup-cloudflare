# Settings for cloudflare.sh. Install as /etc/cloudflare-firewall.conf and apply
# changes with `systemctl reload cloudflare-firewall` (or `cloudflare.sh apply`).

# Addresses and networks that may reach the ports besides Cloudflare, IPv4 or
# IPv6: your monitoring, office, a load balancer. Docker bridges, VPNs and other
# internal networks are not exempt unless they are listed here.
ALLOW=(
    # 203.0.113.10
    # 2001:db8::/64
)

# Ports to restrict, up to 15. Cloudflare proxies HTTP on 80, 8080, 8880, 2052,
# 2082, 2086, 2095 and HTTPS on 443, 2053, 2083, 2087, 2096, 8443.
PORTS=(80 443)
